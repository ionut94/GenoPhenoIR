[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genophenoir"
version = "0.1.0"
description = "Inverted repeat profiling and phenotype prediction pipeline for Arabidopsis thaliana"
requires-python = ">=3.9"
dependencies = [
    "biopython>=1.83",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "shap>=0.44",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pysam>=0.22",
    "torch>=2.1",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[tool.setuptools.packages.find]
include = ["genophenoir*"]
